<!doctype html>
<meta charset="utf-8">
<title>CacheKit theme performance regression</title>
<link rel="stylesheet" href="../style.css">
<style id="fixture-theme">
    :root { --SmartThemeBodyColor: #eee; --SmartThemeBlurTintColor: rgba(23,23,23,.85); --SmartThemeBorderColor: #888; --SmartThemeQuoteColor: #8aa4ff; }
    body { background: #171717; color: #eee; }
    .drawer-content { color: #eee; background: #171717; }
    .drawer-content .menu_button { color: #eee; background-color: rgb(45,45,45); border: 1px solid #888; }
    .drawer-content .menu_button:hover { background-color: rgb(70,70,70); }
    .closed { display: none; }
    #chat { height: 200px; overflow: auto; }
    .mes_block { display: block; } .ch_name { display: flex; }
</style>
<pre id="result">Running…</pre>
<div id="drawer" class="drawer-content closed"><div id="extensions_settings2">
    <section id="settings"><button class="menu_button">Button</button><input class="text_pole"><select class="text_pole"><option>A</option></select><p id="changing-text">Status</p></section>
</div></div>
<div id="chat"></div>
<script type="module">
    import { bindExtensionTheme } from '../src/theme.js';
    import { createMessageCostUi } from '../src/message-cost-ui.js';
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    const frame = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    const result = document.getElementById('result'), settings = document.getElementById('settings');
    let computed = 0, matches = 0, probes = 0, costReads = 0;
    const getComputed = window.getComputedStyle;
    window.getComputedStyle = (...args) => { computed++; return getComputed(...args); };
    const match = Element.prototype.matches;
    Element.prototype.matches = function (...args) { matches++; return match.apply(this, args); };
    const probeObserver = new MutationObserver(records => {
        for (const record of records) for (const node of record.addedNodes) {
            if (node.nodeType === 1 && node.hasAttribute('data-vertex-paygo-probe')) probes++;
        }
    });
    probeObserver.observe(document.body, { childList: true, subtree: true });
    let theme, costUi, floatingTheme;
    window.testResult = { status: 'running' };
    try {
        const snapshot = { version: 1, requests: [{ id: 'request', chatId: 'chat', record: { id: 'request', chatId: 'chat', status: 'complete',
            source: 'makersuite', model: 'fixture', tier: 'standard', usage: { promptTokenCount: 100, candidatesTokenCount: 10 } } }] };
        const messages = Array.from({ length: 1000 }, (_, index) => ({ is_user: index % 2 === 0, extra: { vertex_paygo_cost: snapshot } }));
        document.getElementById('chat').innerHTML = messages.map((_, index) => `<div class="mes" mesid="${index}"><div class="mes_block"><div class="ch_name"><span><time class="timestamp">Time</time></span></div><div class="mes_text">Message</div></div></div>`).join('');
        const context = { chat: messages, eventTypes: {} };
        theme = bindExtensionTheme(settings, { skipBg: true });
        costUi = createMessageCostUi({ getContext: () => context, getPrices: () => ({}), getMessageCost: message => {
            costReads++; return message.extra.vertex_paygo_cost;
        } });
        costUi.render(); await wait(350);
        assert(probes === 0, 'Closed drawers must not create theme probes');
        assert(costReads === 20, 'Only recent model replies should read costs');
        const closed = { computed, matches, probes, costReads };
        document.getElementById('drawer').classList.remove('closed'); await wait(350);
        assert(settings.style.getPropertyValue('--vertex-paygo-button-base-color'), 'Opening a drawer must apply its theme');
        assert(settings.querySelector('button').getAttribute('data-vertex-paygo-control') === 'button', 'Native controls must be adapted');
        assert(!document.querySelector('[data-vertex-paygo-probe]'), 'Sampling must remove probes');
        const style = document.getElementById('fixture-theme');
        style.textContent += '\n.drawer-content .menu_button:hover { background-color: rgb(12,34,56); }';
        await wait(350);
        assert(settings.style.getPropertyValue('--vertex-paygo-button-hover-background').includes('12, 34, 56'), 'CSS theme changes must update hover colors');
        const beforeRepeated = { computed, matches, probes, costReads };
        for (let index = 0; index < 5; index++) { style.textContent = style.textContent; await wait(180); }
        assert(computed === beforeRepeated.computed && probes === beforeRepeated.probes && costReads === beforeRepeated.costReads,
            'Identical stylesheet writes must not resample themes or refresh costs: ' + JSON.stringify({ beforeRepeated, after: { computed, probes, costReads } }));
        const beforeText = { computed, probes, costReads };
        for (let index = 0; index < 100; index++) {
            document.getElementById('changing-text').textContent = 'Status ' + index;
            document.querySelector('.mes:last-child .mes_text').textContent = 'Token ' + index;
        }
        await frame();
        assert(computed === beforeText.computed && probes === beforeText.probes && costReads === beforeText.costReads,
            'Status/token text changes must not trigger theme or cost work');
        const added = document.createElement('button'); added.className = 'menu_button'; settings.append(added); await frame();
        assert(added.getAttribute('data-vertex-paygo-control') === 'button', 'New controls must inherit the sampled theme');
        assert(probes === beforeText.probes, 'New controls must not resample the theme');
        const dialog = document.createElement('dialog'); dialog.innerHTML = '<div class="popup-body"><button class="menu_button">Close</button></div>';
        document.body.append(dialog); floatingTheme = bindExtensionTheme(dialog, { skipBg: false }); dialog.showModal(); await wait(200);
        assert(getComputed(dialog).backgroundColor !== 'rgba(0, 0, 0, 0)', 'Floating dialogs need a readable background');
        const beforeFloating = probes;
        dialog.querySelector('.popup-body').innerHTML = '<button class="menu_button">Replacement</button><p>Updated</p>'; await frame();
        assert(probes === beforeFloating, 'Dialog content changes must reuse its palette');
        assert(dialog.querySelector('button').getAttribute('data-vertex-paygo-control') === 'button', 'Replacement dialog controls must be adapted');
        floatingTheme.destroy(); floatingTheme = null; dialog.remove(); costUi.destroy(); costUi = null; theme.destroy(); theme = null;
        assert(!settings.hasAttribute('data-vertex-paygo-theme') && !settings.querySelector('[data-vertex-paygo-control]'), 'Destroy must restore controls');
        const fallbackDrawer = document.createElement('div'); fallbackDrawer.className = 'drawer-content';
        const fallback = document.createElement('section'); fallback.innerHTML = '<button class="menu_button">Canvas fallback</button>';
        fallbackDrawer.append(fallback); document.body.append(fallbackDrawer);
        const canvasContext = HTMLCanvasElement.prototype.getContext;
        try {
            HTMLCanvasElement.prototype.getContext = () => { throw new Error('Canvas unavailable in fixture'); };
            floatingTheme = bindExtensionTheme(fallback, { skipBg: false }); await frame();
            assert(getComputed(fallback).backgroundColor !== 'rgba(0, 0, 0, 0)', 'Optional Canvas failure must preserve the panel background');
            assert(fallback.style.getPropertyValue('--vertex-paygo-foreground'), 'Optional Canvas failure must preserve foreground colors');
        } finally {
            HTMLCanvasElement.prototype.getContext = canvasContext;
            floatingTheme?.destroy(); floatingTheme = null; fallbackDrawer.remove();
        }
        window.testResult = { status: 'passed', closed, repeatedStylesheetWrites: 5, textUpdates: 200, mountedMessages: 1000 };
        result.textContent = JSON.stringify(window.testResult, null, 2);
    } catch (error) {
        window.testResult = { status: 'failed', error: error.message }; result.textContent = error.stack;
    } finally { floatingTheme?.destroy(); costUi?.destroy(); theme?.destroy(); probeObserver.disconnect(); }
</script>
